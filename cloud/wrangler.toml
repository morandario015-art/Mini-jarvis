name = "jarvis-ai-gateway"
main = "worker.js"
compatibility_date = "2026-10-01"

[vars]
# Set true ONLY after checking the actual provider projects have no paid billing enabled.
FREE_TIER_CONFIRMED = "false"
GROQ_MODEL = "openai/gpt-oss-20b"
GEMINI_MODEL = "gemini-2.5-flash"

[[durable_objects.bindings]]
name = "USAGE_LEDGER"
class_name = "UsageLedger"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UsageLedger"]
